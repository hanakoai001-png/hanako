<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
    }
    .logo p {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 4px;
    }

    /* フラッシュメッセージ */
    .flash {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .flash.error   { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
    .flash.success { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
    .flash.warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .flash.info    { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }

    /* フォーム */
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    input::placeholder { color: #a0aec0; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }

    .divider {
      text-align: center;
      margin: 24px 0 20px;
      position: relative;
      color: #a0aec0;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #e2e8f0;
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .link-btn {
      display: block;
      text-align: center;
      padding: 13px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      text-decoration: none;
      color: #4a5568;
      font-size: 0.9rem;
      font-weight: 600;
      transition: border-color 0.2s, color 0.2s;
    }
    .link-btn:hover { border-color: #667eea; color: #667eea; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">&#x1F511;</div>
      <h1>ログイン</h1>
      <p>アカウントにサインインしてください</p>
    </div>

    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email"
               placeholder="example@email.com" required />
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password"
               placeholder="パスワードを入力" required />
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>

    <div class="divider">または</div>

    <a href="/register" class="link-btn">新規アカウント登録</a>
  </div>
</body>
</html>
