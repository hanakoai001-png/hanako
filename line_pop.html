<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE友達追加 - 花屋はなとく泉北店</title>
<style>
  body { margin: 0; font-family: 'Hiragino Sans', sans-serif; background: #fff; }
  .pop { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 20mm; box-sizing: border-box; }
  .header { background: linear-gradient(135deg, #ff9eb5, #ffb7c5); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
  .header h1 { color: white; font-size: 32px; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
  .header p { color: white; font-size: 16px; margin: 10px 0 0; }
  .qr-section { text-align: center; margin: 30px 0; }
  .qr-box { width: 200px; height: 200px; border: 3px dashed #ff9eb5; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #ff9eb5; font-size: 14px; }
  .qr-text { margin-top: 15px; font-size: 18px; color: #555; font-weight: bold; }
  .benefits { background: #f9f9f9; border-radius: 15px; padding: 25px; margin: 20px 0; }
  .benefits h2 { color: #ff7096; text-align: center; margin-top: 0; }
  .benefit-item { display: flex; align-items: center; margin: 15px 0; font-size: 16px; color: #444; }
  .benefit-item .icon { font-size: 28px; margin-right: 15px; }
  .shop-info { background: linear-gradient(135deg, #c8f0c8, #e0f7e0); border-radius: 15px; padding: 20px; margin-top: 20px; }
  .shop-info h3 { color: #2d7a2d; margin-top: 0; text-align: center; }
  .shop-info p { margin: 8px 0; color: #444; font-size: 15px; }
  @media print { body { -webkit-print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="pop">
  <div class="header">
    <h1>🌸 LINEで簡単お問い合わせ 🌸</h1>
    <p>友達追加してメッセージを送るだけ！</p>
  </div>
  <div class="qr-section">
    <div class="qr-box">QRコードを<br>ここに配置</div>
    <p class="qr-text">📱 QRコードを読み取って友達追加</p>
  </div>
  <div class="benefits">
    <h2>✨ 友達追加のメリット ✨</h2>
    <div class="benefit-item"><span class="icon">🕐</span><span>営業時間・場所がすぐわかる</span></div>
    <div class="benefit-item"><span class="icon">💐</span><span>お花の相談・オーダーができる</span></div>
    <div class="benefit-item"><span class="icon">📅</span><span>予約もLINEで簡単！</span></div>
    <div class="benefit-item"><span class="icon">🚚</span><span>配達のお問い合わせもOK</span></div>
  </div>
  <div class="shop-info">
    <h3>🌿 花屋はなとく 泉北店 🌿</h3>
    <p>📍 大阪府堺市中区小阪270 アンディ泉北</p>
    <p>📞 072-224-8900</p>
    <p>🕐 営業時間：10:00〜19:00（年始休暇のみお休み）</p>
  </div>
</div>
</body>
</html>
