<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はじめてのHTML</title>
  <style>
    body {
      background-color: #f0f0f0;
    }
    h1 {
      color: green;
    }
    button {
      background-color: green;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>はじめてのHTML</h1>
  <p>これはテストです</p>
  <button onclick="alert('売上を記録しました！')">クリック</button>
  <h2>今日の売上</h2>
  <p>¥500</p>
</body>
</html>
